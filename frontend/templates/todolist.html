<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        body {
            background-color: whitesmoke;
            font-family: Arial, Helvetica, sans-serif;
        }

        p {
            text-align: center;
            font-size: 20px;
            color: black;
        }

        .centered {
            margin: auto;
            width: 40%;
            border: 2px solid green;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        input[type="submit"] {
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: darkgreen;
        }
    </style>
</head>

<body>

    <p>Hi, welcome to the TO DO LIST Page</p>
    <p>Today is {{ day_of_week }}</p>
    <p>The Time is {{ current_time }}</p>

    <div class="centered">
        <form action="/submittodoitem" method="POST">
            
            <label for="itemname">Item Name</label>
            <input type="text" name="Item Name" id="Item Name" placeholder="Enter your Item Name" required>

            <label for="description">Item Description</label>
            <input type="text" name="description" id="description" placeholder="Enter your Item Description" required>

            <label for="itemID">Item ID</label>
            <input type="text" name="itemID" id="itemID" placeholder="Enter your Item ID" required>

            <label for="itemUUID">Item UUID</label>
            <input type="text" name="itemUUID" id="itemUUID" placeholder="Enter your Item UUID" required>
            |
            <input type="submit" value="Submit">

        </form>
    </div>

</body>
</html>
